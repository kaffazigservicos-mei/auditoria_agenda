    .ai-credit { width: 210px; color: #F4F7FB; font-family: Inter, Arial, sans-serif; font-size: 24px; line-height: 1.15; letter-spacing: 0.4px; text-align: left; }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="background" src="/home/ubuntu/auditoria_agenda_repo/apresentacao_linkedin_didatica/slide9_generated.webp" alt="Encerramento da apresentação Auditoria Agenda">

      <img class="brand-lockup" src="/home/ubuntu/auditoria_agenda_repo/logo_kaffa_zig_gestao_principal_transparente.png" alt="Logo Kaffa Zig Gestão aprovado">
