    .ai-credit { width: 170px; color: #F4F7FB; font-family: Inter, Arial, sans-serif; font-size: 18px; line-height: 1.15; letter-spacing: 0.25px; text-align: left; }
  </style>
</head>
<body>
  <div class="slide-container">
    <img class="background" src="/home/ubuntu/auditoria_agenda_repo/apresentacao_linkedin_didatica/cover_generated.webp" alt="Capa da apresentação Auditoria Agenda">
    <div class="brand-signature">
      <img class="brand-lockup" src="/home/ubuntu/auditoria_agenda_repo/logo_kaffa_zig_gestao_principal_transparente.png" alt="Logo Kaffa Zig Gestão aprovado">
      <div class="ai-credit">assistida por IAs</div>
    </div>
  </div>
</body>
</html>
